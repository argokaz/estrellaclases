<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computación 2026 – Guía de Sesiones</title>
<style>
/* ── TOKENS ──────────────────────────────────────────────── */
:root{
  --fs-base:18px;          /* 30% > 14px original */
  --fs-sm:15px;
  --fs-xs:13px;
  --fs-lg:22px;
  --fs-xl:26px;
  --fs-h1:32px;

  --b1:#1b7a3e; --b1-light:#e8f5ee;
  --b2:#1565c0; --b2-light:#e3eeff;
  --b3:#b45309; --b3-light:#fef3c7;
  --b4:#6d28d9; --b4-light:#ede9fe;

  --next-bg:#fffbeb;  --next-border:#f59e0b;  --next-accent:#92400e;
  --done-bg:#f8fafc;  --done-text:#94a3b8;
  --mgmt-bg:#f1f5f9;  --mgmt-border:#cbd5e1;

  --ai-color:#db2777;
  --sec-color:#0891b2;

  --radius:14px;
  --shadow:0 2px 12px rgba(0,0,0,.10);
  --shadow-next:0 4px 24px rgba(245,158,11,.30);
}

/* ── RESET ───────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:var(--fs-base);
  background:#f0f4f8;
  color:#1e293b;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;}

/* ── HEADER ──────────────────────────────────────────────── */
.site-header{
  background:linear-gradient(135deg,#0f172a 0%,#1d4ed8 100%);
  color:#fff;
  padding:1.4rem 1rem 0;
  text-align:center;
}
.site-header h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:-1px;line-height:1.1;}
.site-header p{font-size:var(--fs-sm);opacity:.8;margin:.4rem 0 1rem;}
.header-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin-bottom:1rem;}
.chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  border-radius:20px;padding:.25rem .8rem;font-size:var(--fs-xs);}

/* ── GRADE TABS ──────────────────────────────────────────── */
.grade-tabs{
  display:flex;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  background:#0f172a;
  border-top:1px solid rgba(255,255,255,.12);
}
.grade-tabs::-webkit-scrollbar{display:none;}
.gtab{
  flex:0 0 auto;
  color:rgba(255,255,255,.88);
  background:transparent;
  padding:.9rem 1.2rem;
  font-size:var(--fs-sm);font-weight:600;
  border-bottom:3px solid transparent;
  border-right:1px solid rgba(255,255,255,.08);
  white-space:nowrap;
  transition:color .15s,background .15s,border-bottom-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.gtab:hover{color:#fff;background:rgba(255,255,255,.08);}
.gtab.active{
  color:#fbbf24;
  border-bottom-color:#fbbf24;
  background:rgba(251,191,36,.1);
  font-weight:700;
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
.progress-bar-wrap{
  background:#fff;
  padding:.8rem 1rem;
  border-bottom:1px solid #e2e8f0;
  display:flex;align-items:center;gap:.8rem;
}
.progress-label{font-size:var(--fs-sm);color:#64748b;white-space:nowrap;}
.progress-track{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#1d4ed8,#7c3aed);
  border-radius:4px;transition:width .4s ease;}
.progress-pct{font-size:var(--fs-sm);font-weight:700;color:#1d4ed8;white-space:nowrap;}

/* ── PANELS ──────────────────────────────────────────────── */
.panel{display:none;padding:1rem;}
.panel.active{display:block;}

/* ── SECTION HEADERS ─────────────────────────────────────── */
.section-label{
  font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#64748b;
  margin:1.2rem 0 .6rem;display:flex;align-items:center;gap:.5rem;
}
.section-label::after{content:'';flex:1;height:1px;background:#e2e8f0;}

/* ── SESSION CARD ────────────────────────────────────────── */
.card{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:.75rem;
  border:2px solid transparent;
  transition:box-shadow .2s;
  overflow:hidden;
}
.card:hover{box-shadow:0 4px 18px rgba(0,0,0,.14);}

/* Featured next card */
.card.next{
  background:var(--next-bg);
  border-color:var(--next-border);
  box-shadow:var(--shadow-next);
}

/* Done card */
.card.done{
  background:var(--done-bg);
  opacity:.72;
}
.card.done .card-title,.card.done .card-cover{color:var(--done-text);}

/* Management (non-lectivo) */
.card.mgmt{
  background:var(--mgmt-bg);
  border-color:var(--mgmt-border);
  border-style:dashed;
}

/* ── CARD HEADER ─────────────────────────────────────────── */
.card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:.9rem 1rem .5rem;gap:.5rem;
}
.card-meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.snum{
  font-size:var(--fs-lg);font-weight:800;color:#94a3b8;
  line-height:1;min-width:2rem;
}
.card.next .snum{color:var(--next-accent);}
.card.done .snum{color:#cbd5e1;}

.badge{
  display:inline-block;border-radius:6px;
  padding:3px 8px;font-size:var(--fs-xs);font-weight:700;color:#fff;
}
.b-I{background:var(--b1);}  .b-II{background:var(--b2);}
.b-III{background:var(--b3);} .b-IV{background:var(--b4);}

.tag{
  display:inline-block;border-radius:12px;
  padding:2px 8px;font-size:var(--fs-xs);font-weight:600;
}
.tag-ai{background:#fce7f3;color:var(--ai-color);border:1px solid #fbcfe8;}
.tag-sec{background:#e0f2fe;color:var(--sec-color);border:1px solid #bae6fd;}
.tag-next{background:#fef3c7;color:#92400e;border:1px solid #fde68a;}

.card-date{font-size:var(--fs-sm);color:#64748b;}
.card.next .card-date{color:var(--next-accent);font-weight:600;}

/* ── CARD BODY ───────────────────────────────────────────── */
.card-body{padding:.25rem 1rem .8rem;}
.card-focus{
  font-size:var(--fs-xs);color:#6366f1;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:.2rem;
}
.card-title{
  font-size:var(--fs-lg);font-weight:700;line-height:1.25;
  margin-bottom:.5rem;
}
.card.next .card-title{font-size:var(--fs-xl);color:#78350f;}

.expand-btn{
  background:none;border:none;color:#64748b;
  font-size:var(--fs-sm);padding:0;display:flex;align-items:center;gap:.3rem;
  text-decoration:underline;text-underline-offset:3px;margin-bottom:.5rem;
}
.expand-btn .arrow{transition:transform .2s;}
.card.expanded .expand-btn .arrow{transform:rotate(180deg);}

.card-details{display:none;}
.card.expanded .card-details,.card.next .card-details{display:block;}

.detail-row{
  display:grid;grid-template-columns:auto 1fr;gap:.25rem .6rem;
  align-items:start;margin-bottom:.35rem;font-size:var(--fs-sm);
}
.detail-label{font-weight:700;color:#475569;white-space:nowrap;}
.detail-val{color:#334155;line-height:1.5;}
.card.done .detail-label,.card.done .detail-val{color:var(--done-text);}

.ai-box{
  background:#fdf2f8;border:1px solid #f9a8d4;border-radius:8px;
  padding:.5rem .75rem;margin:.5rem 0;
  font-size:var(--fs-sm);color:#831843;line-height:1.5;
}
.card.done .ai-box{filter:grayscale(.8);opacity:.6;}

.materials{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;}
.mat-chip{
  background:#f1f5f9;border:1px solid #cbd5e1;
  border-radius:6px;padding:2px 7px;
  font-size:var(--fs-xs);font-weight:700;color:#475569;
}

/* ── CARD FOOTER ─────────────────────────────────────────── */
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.5rem 1rem .75rem;border-top:1px solid #f1f5f9;flex-wrap:wrap;
}
.card.next .card-foot{border-top-color:#fde68a;}

.foot-actions{display:flex;gap:.4rem;flex-wrap:wrap;}
.slide-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  background:#1e40af;color:#fff;
  border:none;border-radius:8px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  text-decoration:none;
  transition:background .15s;
}
.slide-btn:hover{background:#1d4ed8;}
.notes-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  background:#0f766e;color:#fff;
  border:none;border-radius:8px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  text-decoration:none;
  transition:background .15s;
}
.notes-btn:hover{background:#0d9488;}
.card.next .slide-btn,.card.next .notes-btn{font-size:var(--fs-base);padding:.65rem 1.2rem;}
.card.next .slide-btn{background:#0f172a;}
.card.done .slide-btn,.card.done .notes-btn{background:#64748b;}
.card.done .slide-btn:hover,.card.done .notes-btn:hover{background:#475569;}

.check-btn{
  display:flex;align-items:center;gap:.5rem;
  border:none;border-radius:8px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  transition:all .2s;
}
.check-btn.mark{background:#dcfce7;color:#166534;}
.check-btn.mark:hover{background:#bbf7d0;}
.check-btn.unmark{background:#fee2e2;color:#991b1b;}
.check-btn.unmark:hover{background:#fecaca;}
.card.next .check-btn.mark{
  background:#f59e0b;color:#fff;font-size:var(--fs-base);padding:.65rem 1.2rem;
}
.card.next .check-btn.mark:hover{background:#d97706;}

/* ── MANAGEMENT CARD ─────────────────────────────────────── */
.mgmt-card{
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem 1rem;
}
.mgmt-icon{font-size:1.4rem;flex-shrink:0;}
.mgmt-info p{font-size:var(--fs-sm);color:#64748b;}
.mgmt-info strong{color:#475569;font-size:var(--fs-base);}

/* ── ARCHIVE TOGGLE ──────────────────────────────────────── */
.archive-toggle{
  width:100%;background:#f8fafc;border:2px solid #e2e8f0;
  border-radius:var(--radius);padding:.85rem 1rem;
  text-align:left;display:flex;align-items:center;justify-content:space-between;
  font-size:var(--fs-base);font-weight:600;color:#475569;
  margin:1rem 0 .5rem;
}
.archive-toggle:hover{background:#f1f5f9;}
.archive-arrow{font-size:1rem;transition:transform .25s;}
.archive-arrow.open{transform:rotate(180deg);}
#archive-section{display:none;}
#archive-section.visible{display:block;}

/* ── EMPTY STATE ─────────────────────────────────────────── */
.empty-state{
  text-align:center;padding:2rem 1rem;color:#94a3b8;
  font-size:var(--fs-sm);
}

/* ── MANAGEMENT SIDEBAR NOTE ─────────────────────────────── */
.calendar-note{
  background:#f0fdf4;border:1px solid #86efac;border-radius:10px;
  padding:.75rem 1rem;margin-bottom:.75rem;
  font-size:var(--fs-sm);color:#14532d;
  display:flex;gap:.5rem;align-items:center;
}

/* ── LOCK WALL ───────────────────────────────────────────── */
.lock-wall{
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin:1rem 0 1.5rem;padding:2.2rem 1.5rem;
  text-align:center;border:2px dashed #e2e8f0;
}
.lock-icon-big{font-size:2.8rem;margin-bottom:.5rem;}
.lock-wall h3{font-size:var(--fs-lg);font-weight:800;color:#334155;margin-bottom:.3rem;}
.lock-wall p{font-size:var(--fs-sm);color:#64748b;margin-bottom:1.4rem;}
.lock-input{
  display:block;margin:0 auto .8rem;
  width:100%;max-width:260px;
  border:2px solid #e2e8f0;border-radius:10px;
  padding:.7rem 1rem;font-size:var(--fs-base);
  font-family:inherit;outline:none;text-align:center;
  transition:border-color .2s;
}
.lock-input:focus{border-color:#1d4ed8;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.lock-input.shake{animation:shake .4s ease;}
.lock-btn{
  background:#0f172a;color:#fff;border:none;border-radius:10px;
  padding:.7rem 2.2rem;font-size:var(--fs-base);font-weight:700;
  cursor:pointer;transition:background .15s;
}
.lock-btn:hover{background:#1d4ed8;}
.lock-err{
  color:#dc2626;font-size:var(--fs-sm);margin-top:.65rem;
  display:none;
}
.lock-err.visible{display:block;}

/* ── UNLOCK BAR ──────────────────────────────────────────── */
.unlock-bar{
  display:flex;align-items:center;justify-content:flex-end;gap:.6rem;
  padding:.45rem 1rem;
  background:#f0fdf4;border-bottom:1px solid #bbf7d0;
  font-size:var(--fs-xs);color:#166534;
}
.unlock-bar button{
  background:none;border:1px solid #86efac;border-radius:6px;
  color:#166534;font-size:var(--fs-xs);font-weight:700;
  padding:2px 8px;cursor:pointer;
}
.unlock-bar button:hover{background:#dcfce7;}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media(min-width:640px){
  .panel{padding:1.2rem 1.4rem;}
  .card-title{font-size:var(--fs-lg);}
  .card.next .card-title{font-size:var(--fs-xl);}
}
@media(min-width:900px){
  .future-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .future-grid .card{margin-bottom:0;}
  .done-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .done-grid .card{margin-bottom:0;}
}
@media(min-width:1200px){
  .future-grid{grid-template-columns:1fr 1fr 1fr;}
  .done-grid{grid-template-columns:1fr 1fr 1fr;}
}
.session-note-badge{
  display:inline-block;font-size:var(--fs-xs);color:#92400e;
  background:#fef3c7;border:1px solid #fde68a;
  border-radius:6px;padding:2px 8px;margin-bottom:.4rem;line-height:1.5;
}
</style>
</head>

// ═══════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════
function storageKey(gId){ return `cc2026_done_${gId}`; }
function loadDone(gId){
  try{ return new Set(JSON.parse(localStorage.getItem(storageKey(gId))||'[]')); }
  catch(e){ return new Set(); }
}
function saveDone(gId, set){ localStorage.setItem(storageKey(gId), JSON.stringify([...set])); }

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
const GRADE_ORDER = ['prim6','sec2','sec3','sec4','sec5'];
let currentGrade  = GRADE_ORDER[0];

// ═══════════════════════════════════════════════════════════
// ACCESS CONTROL
// ═══════════════════════════════════════════════════════════
const PASS_KEY   = 'cc2026_unlocked';
const CORRECT_PW = 'yoshipotosucio';

function isUnlocked(){ return localStorage.getItem(PASS_KEY) === '1'; }

function tryUnlock(){
  const input = document.getElementById('pass-input');
  if(!input) return;
  if(input.value === CORRECT_PW){
    localStorage.setItem(PASS_KEY, '1');
    renderPanel(currentGrade);
  } else {
    input.value = '';
    input.classList.add('shake');
    const err = document.getElementById('lock-err');
    if(err) err.classList.add('visible');
    setTimeout(()=> input.classList.remove('shake'), 450);
    input.focus();
  }
}

function lock(){
  localStorage.removeItem(PASS_KEY);
  renderPanel(currentGrade);
}

function todayStr(){
  const d=new Date(); const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}

function render(){
  const tabs = document.getElementById('grade-tabs');
  tabs.innerHTML = GRADE_ORDER.map(id=>{
    const g = GRADES[id];
    return `<button class="gtab" onclick="switchGrade('${id}')">${g.emoji} ${g.label}</button>`;
  }).join('');
  switchGrade(GRADE_ORDER[0]);
}

function switchGrade(gradeId){
  currentGrade = gradeId;
  document.querySelectorAll('.gtab').forEach((t,i)=>{
    t.classList.toggle('active', GRADE_ORDER[i]===gradeId);
  });
  renderPanel(gradeId);
}

function renderPanel(gradeId){
  currentGrade = gradeId;
  const g       = GRADES[gradeId];
  const done    = loadDone(gradeId);
  const today   = todayStr();
  const unlocked = isUnlocked();

  // date <= today  →  past (includes today's session, already happened)
  const allItems = g.sessions.map(sdata=>{
    const calEntry = CALENDAR.find(c=>c.session===sdata.n);
    const isPast   = calEntry && calEntry.date <= today;
    const isDone   = done.has(sdata.n);
    const isOver   = isPast || isDone;
    return {sdata, cal:calEntry, isPast, isDone, isOver};
  });

  const pastItems   = allItems.filter(i=> i.isOver);
  const futureItems = allItems.filter(i=>!i.isOver);
  const nextItem    = futureItems[0] || null;

  // Progress bar
  const doneCount = done.size;
  const pct = Math.round(doneCount/TOTAL*100);
  document.getElementById('prog-label').textContent = `${doneCount} / ${TOTAL} sesiones`;
  document.getElementById('prog-fill').style.width   = pct+'%';
  document.getElementById('prog-pct').textContent    = pct+'%';

  let html = `<div class="panel active" id="panel-${gradeId}">`;
  html += `<div class="calendar-note">🎯 <strong>${g.label}</strong> · ${g.age} · Proyecto: ${g.project}</div>`;

  // ── CLASES PASADAS — siempre visibles ──────────────────────
  html += `<div class="section-label">📦 Clases pasadas (${pastItems.length})</div>`;
  if(pastItems.length){
    html += `<div class="done-grid">`;
    pastItems.forEach(item=>{
      html += buildCard(item.sdata, SESSION_DATE[item.sdata.n], done, gradeId, false);
    });
    html += `</div>`;
  } else {
    html += `<div class="empty-state">Aún no hay clases pasadas para este grado.</div>`;
  }

  // ── CLASES FUTURAS — requieren contraseña ──────────────────
  if(unlocked){
    // Barra de estado desbloqueado
    html += `<div class="unlock-bar">🔓 Modo profesor activo
      <button onclick="lock()">Volver a modo alumno</button>
    </div>`;

    if(nextItem){
      html += `<div class="section-label">🎯 Próxima clase</div>`;
      html += buildCard(nextItem.sdata, SESSION_DATE[nextItem.sdata.n], done, gradeId, true);
    }

    const rest = nextItem ? futureItems.slice(1) : futureItems;
    if(rest.length){
      html += `<div class="section-label">📅 Sesiones futuras (${rest.length})</div>`;
      html += `<div class="future-grid">`;
      rest.forEach(item=>{
        html += buildCard(item.sdata, SESSION_DATE[item.sdata.n], done, gradeId, false);
      });
      html += `</div>`;
    }

    if(!futureItems.length){
      html += `<div class="empty-state">🎉 ¡Todas las sesiones están completadas!</div>`;
    }

  } else {
    // Muro de acceso
    html += `<div class="lock-wall">
      <div class="lock-icon-big">🔒</div>
      <h3>Clases futuras</h3>
      <p>${futureItems.length} sesiones planificadas · Solo para profesores</p>
      <input id="pass-input" class="lock-input" type="password"
        placeholder="Código de acceso" autocomplete="off"
        onkeydown="if(event.key==='Enter') tryUnlock()">
      <button class="lock-btn" onclick="tryUnlock()">Desbloquear</button>
      <div class="lock-err" id="lock-err">Código incorrecto. Inténtalo de nuevo.</div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function buildCard(sdata, cal_info, done, gradeId, isNext){
  const {n, title, cover, act, evidence, tools, mat, ai} = sdata;
  const {block, dateLabel, note} = cal_info;
  const isDone = done.has(n);
  const isAI  = AI_SESSIONS.has(n);
  const isSec = SEC_SESSIONS.has(n);
  const focus = CROSS_FOCUS[n] || '';

  let cls = 'card';
  if(isNext) cls += ' next';
  else if(isDone) cls += ' done';

  const tags = [];
  if(isNext) tags.push(`<span class="tag tag-next">🎯 Próxima</span>`);
  if(isAI)   tags.push(`<span class="tag tag-ai">🤖 IA</span>`);
  if(isSec)  tags.push(`<span class="tag tag-sec">🔒 Seguridad</span>`);

  const aiHtml = ai ? `<div class="ai-box">🤖 <strong>Momento IA:</strong> ${ai}</div>` : '';
  const noteHtml = note ? `<div class="session-note-badge">📌 ${note}</div>` : '';
  const matHtml = `<span class="mat-chip">${mat}</span>`;
  const btnClass = isDone ? 'unmark' : 'mark';
  const btnText  = isDone ? '↩ Desmarcar sesión' : '✓ Marcar como realizada';
  const slideUrl = (SLIDES[gradeId] || {})[n];
  const notasUrl = (NOTAS[gradeId]  || {})[n];
  const slideBtn = slideUrl
    ? `<a href="${slideUrl}" target="_blank" class="slide-btn">🎬 Ver presentación</a>` : '';
  const notasBtn = notasUrl
    ? `<a href="${notasUrl}" target="_blank" class="notes-btn">📋 Notas del profesor</a>` : '';

  const expandBtn = isNext ? '' :
    `<button class="expand-btn" onclick="toggleExpand(this)">
      Ver detalles <span class="arrow">▾</span>
    </button>`;

  return `<div class="${cls}">
    <div class="card-head">
      <div class="card-meta">
        <span class="snum">${n}</span>
        <span class="badge b-${block}">Bloque ${block}</span>
        ${tags.join('')}
      </div>
      <span class="card-date">${dateLabel}</span>
    </div>
    <div class="card-body">
      ${noteHtml}
      <div class="card-focus">${focus}</div>
      <div class="card-title">${title}</div>
      ${expandBtn}
      <div class="card-details">
        <div class="detail-row">
          <span class="detail-label">📖 Cubre:</span>
          <span class="detail-val">${cover}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🎯 Actividad:</span>
          <span class="detail-val">${act}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">📋 Evidencia:</span>
          <span class="detail-val">${evidence}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🛠 Herramientas:</span>
          <span class="detail-val">${tools}</span>
        </div>
        ${aiHtml}
        <div class="detail-row">
          <span class="detail-label">📚 Material:</span>
          <span class="detail-val"><div class="materials">${matHtml}</div></span>
        </div>
      </div>
    </div>
    <div class="card-foot">
      <div class="foot-actions">${slideBtn}${notasBtn}</div>
      <button class="check-btn ${btnClass}" onclick="toggleDone('${gradeId}',${n})">
        ${btnText}
      </button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════
function toggleDone(gradeId, sessionNum){
  const done = loadDone(gradeId);
  if(done.has(sessionNum)) done.delete(sessionNum);
  else done.add(sessionNum);
  saveDone(gradeId, done);
  renderPanel(gradeId);
}

function toggleExpand(btn){
  const card = btn.closest('.card');
  card.classList.toggle('expanded');
}

function toggleArchive(){
  const sec = document.getElementById('archive-section');
  const arr = document.getElementById('arch-arrow');
  sec.classList.toggle('visible');
  arr.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
render();
</script>

</body>
</html>
