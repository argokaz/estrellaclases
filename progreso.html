<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 Mi Progreso · Asunción School</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#ffffff;
  color:#000000;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.site-header{
  background:linear-gradient(135deg,#f7f7f5,#f1f1ef);
  padding:1.4rem 1.2rem 1rem;
  text-align:center;
  border-bottom:1px solid #e6e6e6;
}
.site-header h1{font-size:1.4rem;font-weight:900;color:#b45309;margin-bottom:.25rem;}
.site-header p{font-size:.85rem;color:#555555;}
.back-link{display:inline-block;margin:.7rem 0 0;font-size:.82rem;color:#555555;text-decoration:none;}
.back-link:hover{color:#b45309;}

.container{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
}

.search-card{
  background:#f7f7f5;
  border:2px solid #e6e6e6;
  border-radius:16px;
  padding:2rem 1.6rem;
  width:100%;
  max-width:480px;
  box-shadow:0 8px 32px rgba(0,0,0,.10);
}
.search-card h2{
  font-size:1.2rem;font-weight:900;color:#000;
  margin-bottom:.35rem;
}
.search-card p{
  font-size:.88rem;color:#555555;
  margin-bottom:1.5rem;line-height:1.6;
}

.form-group{margin-bottom:1.1rem;}
.form-group label{
  display:block;font-size:.8rem;font-weight:700;
  color:#555555;text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:.45rem;
}
.form-group select,
.form-group input{
  width:100%;
  background:#ffffff;
  border:1.5px solid #e6e6e6;
  color:#fff;
  padding:.7rem .9rem;
  border-radius:10px;
  font-size:1rem;
  font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
  outline:none;
  -webkit-appearance:none;
}
.form-group input::placeholder{color:#555555;}
.form-group select:focus,
.form-group input:focus{
  border-color:#1d4ed8;
  box-shadow:0 0 0 3px rgba(96,165,250,.2);
}
.form-group select option{background:#ffffff;}

.search-btn{
  width:100%;
  background:#1d4ed8;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:.85rem;
  font-size:1.05rem;
  font-weight:800;
  cursor:pointer;
  font-family:inherit;
  margin-top:.4rem;
  transition:opacity .15s,transform .1s;
  letter-spacing:.02em;
}
.search-btn:hover{opacity:.9;transform:translateY(-1px);}
.search-btn:active{transform:translateY(0);}
.search-error{
  font-size:.85rem;color:#b91c1c;
  margin-top:.6rem;min-height:1.2em;font-weight:600;
}
</style>
</head>
<body>

<div class="site-header">
  <h1>📊 Mi Progreso · Asunción School</h1>
  <p>Computación 2026 · Prof. Estrella Vizcarra</p>
  <a href="/" class="back-link">← Volver al inicio</a>
</div>

<div class="container">
  <div class="search-card">
    <h2>Busca tu progreso</h2>
    <p>Elige tu grado, escribe tu nombre y ve tus notas de todas las sesiones.</p>

    <datalist id="alumnos-dl"></datalist>

    <div class="form-group">
      <label for="sel-grado">1. Tu grado</label>
      <select id="sel-grado" onchange="onGradoChange()">
        <option value="prim6">6.° Primaria</option>
        <option value="sec2">2.° Secundaria</option>
        <option value="sec3">3.° Secundaria</option>
        <option value="sec4">4.° Secundaria</option>
        <option value="sec5">5.° Secundaria</option>
      </select>
    </div>

    <div class="form-group">
      <label for="inp-nombre">2. Tu nombre completo</label>
      <input id="inp-nombre" type="text" list="alumnos-dl"
        placeholder="Escribe o selecciona tu nombre…"
        autocomplete="off"
        oninput="onNombreInput()"
        onkeydown="if(event.key==='Enter'){event.preventDefault();ir();}">
    </div>

    <button class="search-btn" onclick="ir()">🔍 Ver mis notas</button>
    <div class="search-error" id="search-error"></div>
  </div>
</div>

<script>
const GRADE_ACCENTS = {prim6:'#15803d', sec2:'#1d4ed8', sec3:'#c2410c', sec4:'#7c3aed', sec5:'#b91c1c'};

let _nombres = [];
let _timer   = null;

function onGradoChange(){
  document.getElementById('inp-nombre').value = '';
  document.getElementById('search-error').textContent = '';
  cargarNombres();
  const grado = document.getElementById('sel-grado').value;
  document.querySelector('.search-btn').style.background =
    `linear-gradient(135deg,${GRADE_ACCENTS[grado]},${GRADE_ACCENTS[grado]}cc)`;
}

async function cargarNombres(){
  const grado = document.getElementById('sel-grado').value;
  _nombres = [];
  try {
    const r = await fetch(`/.netlify/functions/get-roster?grado=${grado}`);
    if(r.ok){
      const d = await r.json();
      if(d.alumnos && d.alumnos.length){
        _nombres = d.alumnos.map(a => a.nombre);
        actualizarDatalist();
        return;
      }
    }
    // Fallback: ranking
    const mes = new Date().toISOString().slice(0,7);
    const r2 = await fetch(`/.netlify/functions/get-ranking?grado=${grado}&mes=${mes}`);
    if(r2.ok){
      const d2 = await r2.json();
      _nombres = (d2.ranking||[]).map(s => s.nombre);
      actualizarDatalist();
    }
  } catch(e){ /* silencioso */ }
}

function actualizarDatalist(){
  const dl = document.getElementById('alumnos-dl');
  if(dl) dl.innerHTML = _nombres.map(n => `<option value="${n}">`).join('');
}

function onNombreInput(){
  const val = (document.getElementById('inp-nombre').value || '').trim();
  clearTimeout(_timer);
  const match = _nombres.find(n => n.toLowerCase() === val.toLowerCase());
  if(match && val.split(/\s+/).filter(Boolean).length >= 2){
    _timer = setTimeout(() => ir(), 150);
  }
}

function ir(){
  const nombre = (document.getElementById('inp-nombre').value || '').trim();
  const grado  = document.getElementById('sel-grado').value;
  const errEl  = document.getElementById('search-error');
  if(nombre.split(/\s+/).filter(Boolean).length < 2){
    errEl.textContent = '⚠️ Escribe tu nombre y apellido completo.';
    return;
  }
  errEl.textContent = '';
  // Navegar a la página de perfil individual
  location.href = `/perfil.html?nombre=${encodeURIComponent(nombre)}&grado=${encodeURIComponent(grado)}`;
}

// Inicializar
onGradoChange();

// Auto-fill desde querystring
(function(){
  const sp = new URLSearchParams(location.search);
  const qGrado = sp.get('grado');
  const qNombre = sp.get('nombre');
  if(qGrado && document.querySelector(`#sel-grado option[value="${qGrado}"]`)){
    document.getElementById('sel-grado').value = qGrado;
  }
  if(qNombre) document.getElementById('inp-nombre').value = qNombre;
  onGradoChange();
})();
</script>
</body>
</html>
