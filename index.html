<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computación 2026 – Guía de Sesiones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
/* ── TOKENS ──────────────────────────────────────────────── */
:root{
  --fs-base:18px;
  --fs-sm:15px;
  --fs-xs:13px;
  --fs-lg:22px;
  --fs-xl:26px;
  --fs-h1:32px;

  /* Design system dark palette */
  --bg:   #060d1f;
  --bg2:  #0d1730;
  --card: rgba(13,23,48,0.82);
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(79,142,247,0.30);

  --blue:       #4f8ef7;
  --blue-glow:  rgba(79,142,247,0.35);
  --violet:     #8b5cf6;
  --gold:       #f59e0b;
  --green:      #10b981;
  --teal:       #0d9488;

  --text:       #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim:   #64748b;

  /* Block accent colors (softer on dark) */
  --b1:#22c55e; --b2:#60a5fa; --b3:#fb923c; --b4:#a78bfa;

  --next-border:#f59e0b; --next-accent:#fcd34d;
  --done-text:#475569;

  --ai-color:#f472b6;
  --sec-color:#38bdf8;

  --radius:16px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-next:0 8px 32px rgba(245,158,11,.25);
}

/* ── RESET ───────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  font-size:var(--fs-base);
  background:var(--bg);
  color:var(--text);
  -webkit-text-size-adjust:100%;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}

/* ── HEADER ──────────────────────────────────────────────── */
.site-header{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,#060d1f 0%,#0d1730 50%,#0f172a 100%);
  border-bottom:1px solid var(--border);
  color:#fff;
  padding:2rem 1rem 0;
  text-align:center;
}
.site-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 60% 40%,rgba(79,142,247,.10) 0%,transparent 70%),
    radial-gradient(ellipse 45% 45% at 20% 70%,rgba(139,92,246,.07) 0%,transparent 60%);
}
.site-header h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:var(--fs-h1);font-weight:800;letter-spacing:-1px;line-height:1.1;
  background:linear-gradient(135deg,#fff 30%,var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  position:relative;
}
.site-header p{font-size:var(--fs-sm);opacity:.65;margin:.4rem 0 1rem;position:relative;}
.header-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin-bottom:1rem;position:relative;}
.chip{
  background:rgba(79,142,247,.12);
  border:1px solid rgba(79,142,247,.25);
  border-radius:100px;padding:.25rem .85rem;
  font-size:var(--fs-xs);font-weight:600;color:#93c5fd;
}

/* ── GRADE TABS ──────────────────────────────────────────── */
.grade-tabs{
  display:flex;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  background:var(--bg2);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.grade-tabs::-webkit-scrollbar{display:none;}
.gtab{
  flex:0 0 auto;
  color:var(--text-muted);
  background:transparent;
  padding:.85rem 1.2rem;
  font-size:var(--fs-sm);font-weight:600;
  border-bottom:2px solid transparent;
  border-right:1px solid var(--border);
  white-space:nowrap;
  transition:color .15s,background .15s,border-bottom-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.gtab:hover{color:var(--text);background:rgba(79,142,247,.06);}
.gtab.active{
  color:var(--blue);
  border-bottom-color:var(--blue);
  background:rgba(79,142,247,.10);
  font-weight:700;
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
.progress-bar-wrap{
  background:var(--bg2);
  padding:.75rem 1rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.8rem;
}
.progress-label{font-size:var(--fs-sm);color:var(--text-muted);white-space:nowrap;}
.progress-track{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));
  border-radius:4px;transition:width .4s ease;}
.progress-pct{font-size:var(--fs-sm);font-weight:700;color:var(--blue);white-space:nowrap;}

/* ── PANELS ──────────────────────────────────────────────── */
.panel{display:none;padding:1rem;}
.panel.active{display:block;}

/* ── SECTION HEADERS ─────────────────────────────────────── */
.section-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:var(--fs-base);font-weight:800;
  letter-spacing:-.2px;
  margin:2rem 0 .9rem;
  display:flex;align-items:center;gap:.7rem;
  padding-bottom:.55rem;
  border-bottom:2px solid var(--border);
}
.section-label.sl-past{
  color:var(--text-dim);
  border-bottom-color:rgba(255,255,255,.06);
}
.section-label.sl-next{
  color:var(--gold);
  border-bottom-color:rgba(245,158,11,.4);
  font-size:var(--fs-lg);
}
.section-label.sl-future{
  color:var(--blue);
  border-bottom-color:rgba(79,142,247,.3);
}
.section-label .sl-count{
  font-size:var(--fs-xs);font-weight:600;
  padding:2px 9px;border-radius:20px;
  margin-left:.15rem;
}
.sl-past .sl-count{background:rgba(255,255,255,.05);color:var(--text-dim);}
.sl-next .sl-count{display:none;}
.sl-future .sl-count{background:rgba(79,142,247,.1);color:#93c5fd;}

/* ── SESSION CARD ────────────────────────────────────────── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:.75rem;
  backdrop-filter:blur(16px);
  transition:border-color .25s,transform .25s,box-shadow .25s;
  overflow:hidden;
}
.card:hover{
  border-color:var(--border-hover);
  transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(0,0,0,.5);
}

/* Featured next card */
.card.next{
  background:rgba(245,158,11,.08);
  border-color:rgba(245,158,11,.4);
  box-shadow:var(--shadow-next);
}
.card.next:hover{border-color:rgba(245,158,11,.65);}

/* Done card */
.card.done{
  background:rgba(6,13,31,.7);
  border-color:rgba(255,255,255,.04);
  opacity:.45;
  filter:saturate(.3);
}
.card.done:hover{
  opacity:.7;
  filter:saturate(.6);
  transform:none;
  box-shadow:var(--shadow);
  border-color:rgba(255,255,255,.08);
}
.card.done .card-title,.card.done .card-cover{color:var(--done-text);}

/* Management (non-lectivo) */
.card.mgmt{
  background:rgba(13,23,48,.4);
  border-color:rgba(255,255,255,.1);
  border-style:dashed;
}

/* ── CARD HEADER ─────────────────────────────────────────── */
.card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:.9rem 1rem .5rem;gap:.5rem;
}
.card-meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.snum{
  font-family:'Space Grotesk',sans-serif;
  font-size:var(--fs-lg);font-weight:800;color:var(--text-dim);
  line-height:1;min-width:2rem;
}
.card.next .snum{color:var(--gold);}
.card.done .snum{color:#334155;}

.badge{
  display:inline-block;border-radius:100px;
  padding:3px 10px;font-size:var(--fs-xs);font-weight:700;
}
.b-I{ background:rgba(34,197,94,.15);  color:#4ade80; border:1px solid rgba(34,197,94,.3);  }
.b-II{ background:rgba(96,165,250,.15); color:#93c5fd; border:1px solid rgba(96,165,250,.3); }
.b-III{background:rgba(251,146,60,.15); color:#fdba74; border:1px solid rgba(251,146,60,.3); }
.b-IV{ background:rgba(167,139,250,.15);color:#c4b5fd; border:1px solid rgba(167,139,250,.3);}

.tag{
  display:inline-block;border-radius:100px;
  padding:2px 10px;font-size:var(--fs-xs);font-weight:600;
}
.tag-ai{ background:rgba(244,114,182,.12);color:var(--ai-color); border:1px solid rgba(244,114,182,.3);}
.tag-sec{background:rgba(56,189,248,.12); color:var(--sec-color);border:1px solid rgba(56,189,248,.3);}
.tag-next{background:rgba(245,158,11,.15);color:var(--gold);     border:1px solid rgba(245,158,11,.35);}

.card-date{font-size:var(--fs-sm);color:var(--text-dim);}
.card.next .card-date{color:var(--gold);font-weight:600;}

/* ── CARD BODY ───────────────────────────────────────────── */
.card-body{padding:.25rem 1rem .8rem;}
.card-focus{
  font-size:var(--fs-xs);color:var(--violet);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:.2rem;
}
.card-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:var(--fs-lg);font-weight:700;line-height:1.25;
  margin-bottom:.5rem;color:var(--text);
}
.card.next .card-title{font-size:var(--fs-xl);color:var(--gold);}
.card.done .card-title{color:var(--done-text);}

.expand-btn{
  background:none;border:none;color:var(--text-dim);
  font-size:var(--fs-sm);padding:0;display:flex;align-items:center;gap:.3rem;
  text-decoration:underline;text-underline-offset:3px;margin-bottom:.5rem;
}
.expand-btn:hover{color:var(--blue);}
.expand-btn .arrow{transition:transform .2s;}
.card.expanded .expand-btn .arrow{transform:rotate(180deg);}

.card-details{display:none;}
.card.expanded .card-details,.card.next .card-details{display:block;}

.detail-row{
  display:grid;grid-template-columns:auto 1fr;gap:.25rem .6rem;
  align-items:start;margin-bottom:.35rem;font-size:var(--fs-sm);
}
.detail-label{font-weight:700;color:var(--text-muted);white-space:nowrap;}
.detail-val{color:var(--text);line-height:1.5;opacity:.85;}
.card.done .detail-label,.card.done .detail-val{color:var(--done-text);}

.ai-box{
  background:rgba(244,114,182,.08);border:1px solid rgba(244,114,182,.25);
  border-radius:10px;padding:.5rem .75rem;margin:.5rem 0;
  font-size:var(--fs-sm);color:#f9a8d4;line-height:1.5;
}
.card.done .ai-box{filter:grayscale(.8);opacity:.4;}

.materials{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;}
.mat-chip{
  background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.25);
  border-radius:100px;padding:2px 9px;
  font-size:var(--fs-xs);font-weight:700;color:#93c5fd;
}

/* ── CARD FOOTER ─────────────────────────────────────────── */
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.5rem 1rem .75rem;border-top:1px solid var(--border);flex-wrap:wrap;
}
.card.next .card-foot{border-top-color:rgba(245,158,11,.25);}

.foot-actions{display:flex;gap:.4rem;flex-wrap:wrap;}
.slide-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:#fff;border:none;border-radius:10px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  text-decoration:none;
  box-shadow:0 4px 16px rgba(79,142,247,.3);
  transition:transform .18s,box-shadow .18s;
}
.slide-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(79,142,247,.45);}
.notes-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  background:rgba(13,148,136,.15);
  color:#5eead4;
  border:1px solid rgba(13,148,136,.35);
  border-radius:10px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  text-decoration:none;
  transition:background .15s,border-color .15s,transform .15s;
}
.notes-btn:hover{background:rgba(13,148,136,.28);border-color:rgba(13,148,136,.6);transform:translateY(-1px);}
.repaso-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  background:rgba(245,158,11,.12);
  color:#fcd34d;
  border:1px solid rgba(245,158,11,.35);
  border-radius:10px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  text-decoration:none;
  transition:background .15s,border-color .15s,transform .15s;
}
.repaso-btn:hover{background:rgba(245,158,11,.24);border-color:rgba(245,158,11,.6);transform:translateY(-1px);}
.card.next .slide-btn,.card.next .notes-btn,.card.next .repaso-btn{font-size:var(--fs-base);padding:.65rem 1.2rem;}
.card.done .slide-btn{background:rgba(100,116,139,.5);box-shadow:none;}
.card.done .notes-btn{background:rgba(100,116,139,.15);border-color:rgba(100,116,139,.3);color:#64748b;}
.card.done .repaso-btn{background:rgba(100,116,139,.15);border-color:rgba(100,116,139,.3);color:#64748b;}
.card.done .slide-btn:hover,.card.done .notes-btn:hover,.card.done .repaso-btn:hover{transform:none;}

.check-btn{
  display:flex;align-items:center;gap:.5rem;
  border:none;border-radius:10px;
  padding:.5rem .9rem;
  font-size:var(--fs-sm);font-weight:600;
  transition:all .2s;
}
.check-btn.mark{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);}
.check-btn.mark:hover{background:rgba(16,185,129,.28);border-color:rgba(16,185,129,.55);}
.check-btn.unmark{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
.check-btn.unmark:hover{background:rgba(239,68,68,.22);}
.card.next .check-btn.mark{
  background:rgba(245,158,11,.18);color:var(--gold);
  border:1px solid rgba(245,158,11,.4);
  font-size:var(--fs-base);padding:.65rem 1.2rem;
}
.card.next .check-btn.mark:hover{background:rgba(245,158,11,.3);}

/* ── MANAGEMENT CARD ─────────────────────────────────────── */
.mgmt-card{
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem 1rem;
}
.mgmt-icon{font-size:1.4rem;flex-shrink:0;}
.mgmt-info p{font-size:var(--fs-sm);color:var(--text-dim);}
.mgmt-info strong{color:var(--text-muted);font-size:var(--fs-base);}

/* ── ARCHIVE TOGGLE ──────────────────────────────────────── */
.archive-toggle{
  width:100%;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:.85rem 1rem;
  text-align:left;display:flex;align-items:center;justify-content:space-between;
  font-size:var(--fs-base);font-weight:600;color:var(--text-muted);
  margin:1rem 0 .5rem;
  transition:background .15s,border-color .15s;
}
.archive-toggle:hover{background:rgba(79,142,247,.08);border-color:var(--border-hover);}
.archive-arrow{font-size:1rem;transition:transform .25s;}
.archive-arrow.open{transform:rotate(180deg);}
#archive-section{display:none;}
#archive-section.visible{display:block;}

/* ── EMPTY STATE ─────────────────────────────────────────── */
.empty-state{
  text-align:center;padding:2rem 1rem;color:var(--text-muted);
  font-size:var(--fs-sm);
}

/* ── MANAGEMENT SIDEBAR NOTE ─────────────────────────────── */
.calendar-note{
  background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:10px;
  padding:.75rem 1rem;margin-bottom:.75rem;
  font-size:var(--fs-sm);color:#6ee7b7;
  display:flex;gap:.5rem;align-items:center;
}

/* ── LOCK WALL ───────────────────────────────────────────── */
.lock-wall{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);backdrop-filter:blur(16px);
  margin:1rem 0 1.5rem;padding:2.2rem 1.5rem;
  text-align:center;border:1px dashed rgba(255,255,255,.15);
}
.lock-icon-big{font-size:2.8rem;margin-bottom:.5rem;}
.lock-wall h3{font-size:var(--fs-lg);font-weight:800;color:var(--text);margin-bottom:.3rem;}
.lock-wall p{font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:1.4rem;}
.lock-input{
  display:block;margin:0 auto .8rem;
  width:100%;max-width:260px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:10px;
  padding:.7rem 1rem;font-size:var(--fs-base);color:var(--text);
  font-family:inherit;outline:none;text-align:center;
  transition:border-color .2s;
}
.lock-input::placeholder{color:var(--text-dim);}
.lock-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,142,247,.18);}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.lock-input.shake{animation:shake .4s ease;}
.lock-btn{
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:#fff;border:none;border-radius:10px;
  padding:.7rem 2.2rem;font-size:var(--fs-base);font-weight:700;
  cursor:pointer;transition:opacity .15s,transform .15s;
  box-shadow:0 4px 16px rgba(79,142,247,.3);
}
.lock-btn:hover{opacity:.9;transform:translateY(-1px);}
.lock-err{
  color:#f87171;font-size:var(--fs-sm);margin-top:.65rem;
  display:none;
}
.lock-err.visible{display:block;}

/* ── UNLOCK BAR (inside panel, secondary) ────────────────── */
.unlock-bar{
  display:flex;align-items:center;gap:.5rem;
  padding:.4rem 1rem;
  background:rgba(16,185,129,.08);border-bottom:1px solid rgba(16,185,129,.2);
  font-size:var(--fs-xs);color:#6ee7b7;
  font-weight:600;letter-spacing:.3px;
}

/* ── LOGOUT BUTTON (fixed top-right, always on top) ─────── */
.logout-btn{
  position:fixed;top:12px;right:12px;z-index:999;
  background:rgba(13,23,48,.85);
  border:1px solid var(--border);
  color:var(--text-muted);border-radius:9px;
  padding:.38rem .9rem;
  font-size:var(--fs-xs);font-weight:700;
  cursor:pointer;font-family:inherit;
  backdrop-filter:blur(12px);
  transition:background .15s,border-color .15s,color .15s;
  display:none;
  white-space:nowrap;
}
.logout-btn:hover{
  background:rgba(220,38,38,.75);
  border-color:rgba(239,68,68,.5);
  color:#fff;
}
.logout-btn.visible{display:block;}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media(min-width:640px){
  .panel{padding:1.2rem 1.4rem;}
  .card-title{font-size:var(--fs-lg);}
  .card.next .card-title{font-size:var(--fs-xl);}
}
@media(min-width:900px){
  .future-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .future-grid .card{margin-bottom:0;}
  .done-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .done-grid .card{margin-bottom:0;}
}
@media(min-width:1200px){
  .future-grid{grid-template-columns:1fr 1fr 1fr;}
  .done-grid{grid-template-columns:1fr 1fr 1fr;}
}
.session-note-badge{
  display:inline-block;font-size:var(--fs-xs);color:var(--gold);
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);
  border-radius:6px;padding:2px 8px;margin-bottom:.4rem;line-height:1.5;
}

/* ── RESULTS MODAL ──────────────────────────────────────── */
.results-overlay{
  display:none;position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  overflow-y:auto;
}
.results-overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:40px 16px 60px;}
.results-panel{
  background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:940px;padding:32px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.results-panel-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:22px;gap:12px;flex-wrap:wrap;
}
.results-panel-header h2{
  font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;color:#fff;
}
.results-header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.results-session-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.results-session-tab{
  background:transparent;border:1px solid var(--border);color:var(--text-muted);
  border-radius:8px;padding:.4rem 1.1rem;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .15s;font-family:inherit;
}
.results-session-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}

// STORAGE
// ═══════════════════════════════════════════════════════════
function storageKey(gId){ return `cc2026_done_${gId}`; }
function loadDone(gId){
  try{ return new Set(JSON.parse(localStorage.getItem(storageKey(gId))||'[]')); }
  catch(e){ return new Set(); }
}
function saveDone(gId, set){ localStorage.setItem(storageKey(gId), JSON.stringify([...set])); }

// RENDER
// ═══════════════════════════════════════════════════════════
const GRADE_ORDER = ['prim6','sec2','sec3','sec4','sec5'];
let currentGrade  = GRADE_ORDER[0];

// ═══════════════════════════════════════════════════════════
// ACCESS CONTROL
// ═══════════════════════════════════════════════════════════
const PASS_KEY   = 'cc2026_unlocked';
const CORRECT_PW = 'yoshipotosucio';

function isUnlocked(){ return localStorage.getItem(PASS_KEY) === '1'; }

function tryUnlock(){
  const input = document.getElementById('pass-input');
  if(!input) return;
  if(input.value === CORRECT_PW){
    localStorage.setItem(PASS_KEY, '1');
    updateLogoutBtn();
    renderPanel(currentGrade);
  } else {
    input.value = '';
    input.classList.add('shake');
    const err = document.getElementById('lock-err');
    if(err) err.classList.add('visible');
    setTimeout(()=> input.classList.remove('shake'), 450);
    input.focus();
  }
}

function lock(){
  localStorage.removeItem(PASS_KEY);
  updateLogoutBtn();
  renderPanel(currentGrade);
}

function updateLogoutBtn(){
  const btn = document.getElementById('logout-btn');
  if(!btn) return;
  btn.classList.toggle('visible', isUnlocked());
}

function todayStr(){
  const d=new Date(); const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}

function render(){
  const tabs = document.getElementById('grade-tabs');
  tabs.innerHTML = GRADE_ORDER.map(id=>{
    const g = GRADES[id];
    return `<button class="gtab" onclick="switchGrade('${id}')">${g.emoji} ${g.label}</button>`;
  }).join('');
  switchGrade(GRADE_ORDER[0]);
}

function switchGrade(gradeId){
  currentGrade = gradeId;
  document.querySelectorAll('.gtab').forEach((t,i)=>{
    t.classList.toggle('active', GRADE_ORDER[i]===gradeId);
  });
  renderPanel(gradeId);
}

function renderPanel(gradeId){
  currentGrade = gradeId;
  const g       = GRADES[gradeId];
  const done    = loadDone(gradeId);
  const today   = todayStr();
  const unlocked = isUnlocked();

  // date <= today  →  past (includes today's session, already happened)
  const allItems = g.sessions.map(sdata=>{
    const calEntry = CALENDAR.find(c=>c.session===sdata.n);
    const isPast   = calEntry && calEntry.date <= today;
    const isDone   = done.has(sdata.n);
    const isOver   = isPast || isDone;
    return {sdata, cal:calEntry, isPast, isDone, isOver};
  });

  const pastItems   = allItems.filter(i=> i.isOver);
  const futureItems = allItems.filter(i=>!i.isOver);
  const nextItem    = futureItems[0] || null;

  // Progress bar
  const doneCount = done.size;
  const pct = Math.round(doneCount/TOTAL*100);
  document.getElementById('prog-label').textContent = `${doneCount} / ${TOTAL} sesiones`;
  document.getElementById('prog-fill').style.width   = pct+'%';
  document.getElementById('prog-pct').textContent    = pct+'%';

  let html = `<div class="panel active" id="panel-${gradeId}">`;
  html += `<div class="calendar-note">🎯 <strong>${g.label}</strong> · ${g.age} · Proyecto: ${g.project}</div>`;

  // ── CLASES PASADAS — siempre visibles ──────────────────────
  html += `<div class="section-label sl-past">📦 Clases pasadas <span class="sl-count">${pastItems.length}</span></div>`;
  if(pastItems.length){
    html += `<div class="done-grid">`;
    pastItems.forEach(item=>{
      html += buildCard(item.sdata, SESSION_DATE[item.sdata.n], done, gradeId, false, unlocked);
    });
    html += `</div>`;
  } else {
    html += `<div class="empty-state">Aún no hay clases pasadas para este grado.</div>`;
  }

  // ── CLASES FUTURAS — requieren contraseña ──────────────────
  if(unlocked){
    // Barra de estado desbloqueado
    html += `<div class="unlock-bar">🔓 Modo profesor activo <button class="results-open-btn" onclick="openResults(null, '${gradeId}')">📊 Ver resultados de alumnos</button></div>`;

    if(nextItem){
      html += `<div class="section-label sl-next">🎯 Próxima clase</div>`;
      html += buildCard(nextItem.sdata, SESSION_DATE[nextItem.sdata.n], done, gradeId, true, true);
    }

    const rest = nextItem ? futureItems.slice(1) : futureItems;
    if(rest.length){
      html += `<div class="section-label sl-future">📅 Sesiones futuras <span class="sl-count">${rest.length}</span></div>`;
      html += `<div class="future-grid">`;
      rest.forEach(item=>{
        html += buildCard(item.sdata, SESSION_DATE[item.sdata.n], done, gradeId, false, true);
      });
      html += `</div>`;
    }

    if(!futureItems.length){
      html += `<div class="empty-state">🎉 ¡Todas las sesiones están completadas!</div>`;
    }

  } else {
    // Muro de acceso
    html += `<div class="lock-wall">
      <div class="lock-icon-big">🔒</div>
      <h3>Clases futuras</h3>
      <p>${futureItems.length} sesiones planificadas · Solo para profesores</p>
      <input id="pass-input" class="lock-input" type="password"
        placeholder="Código de acceso" autocomplete="off"
        onkeydown="if(event.key==='Enter') tryUnlock()">
      <button class="lock-btn" onclick="tryUnlock()">Desbloquear</button>
      <div class="lock-err" id="lock-err">Código incorrecto. Inténtalo de nuevo.</div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function buildCard(sdata, cal_info, done, gradeId, isNext, unlocked=false){
  const {n, title, cover, act, evidence, tools, mat, ai} = sdata;
  const {block, dateLabel, note} = cal_info;
  const isDone = done.has(n);
  const isAI  = AI_SESSIONS.has(n);
  const isSec = SEC_SESSIONS.has(n);
  const focus = CROSS_FOCUS[n] || '';

  let cls = 'card';
  if(isNext) cls += ' next';
  else if(isDone) cls += ' done';

  const tags = [];
  if(isNext) tags.push(`<span class="tag tag-next">🎯 Próxima</span>`);
  if(isAI)   tags.push(`<span class="tag tag-ai">🤖 IA</span>`);
  if(isSec)  tags.push(`<span class="tag tag-sec">🔒 Seguridad</span>`);

  const aiHtml = ai ? `<div class="ai-box">🤖 <strong>Momento IA:</strong> ${ai}</div>` : '';
  const noteHtml = note ? `<div class="session-note-badge">📌 ${note}</div>` : '';
  const matHtml = `<span class="mat-chip">${mat}</span>`;
  const btnClass = isDone ? 'unmark' : 'mark';
  const btnText  = isDone ? '↩ Desmarcar sesión' : '✓ Marcar como realizada';
  const pad = x => String(x).padStart(2,'0');
  const slideUrl  = READY_SESSIONS.has(n)  ? `slides/sesion-${pad(n)}-${gradeId}.html`  : '';
  const notasUrl  = READY_SESSIONS.has(n)  ? `slides/notas-${pad(n)}-${gradeId}.html`   : '';
  const repasoUrl = REPASO_SESSIONS.has(n) ? `slides/repaso-${pad(n)}-${gradeId}.html`  : '';
  const slideBtn  = slideUrl
    ? `<a href="${slideUrl}"  target="_blank" class="slide-btn">🎬 Ver presentación</a>` : '';
  const notasBtn  = (notasUrl && unlocked)
    ? `<a href="${notasUrl}"  target="_blank" class="notes-btn">📋 Notas del profesor</a>` : '';
  const repasoBtn = repasoUrl
    ? `<a href="${repasoUrl}" target="_blank" class="repaso-btn">📝 Guía de repaso</a>` : '';
  const resultsBtn = (repasoUrl && unlocked)
    ? `<button class="results-card-btn" onclick="openResults(${n}, '${gradeId}')">📊 Resultados</button>` : '';

  const expandBtn = isNext ? '' :
    `<button class="expand-btn" onclick="toggleExpand(this)">
      Ver detalles <span class="arrow">▾</span>
    </button>`;

  return `<div class="${cls}">
    <div class="card-head">
      <div class="card-meta">
        <span class="snum">${n}</span>
        <span class="badge b-${block}">Bloque ${block}</span>
        ${tags.join('')}
      </div>
      <span class="card-date">${dateLabel}</span>
    </div>
    <div class="card-body">
      ${noteHtml}
      <div class="card-focus">${focus}</div>
      <div class="card-title">${title}</div>
      ${expandBtn}
      <div class="card-details">
        <div class="detail-row">
          <span class="detail-label">📖 Cubre:</span>
          <span class="detail-val">${cover}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🎯 Actividad:</span>
          <span class="detail-val">${act}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">📋 Evidencia:</span>
          <span class="detail-val">${evidence}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">🛠 Herramientas:</span>
          <span class="detail-val">${tools}</span>
        </div>
        ${aiHtml}
        <div class="detail-row">
          <span class="detail-label">📚 Material:</span>
          <span class="detail-val"><div class="materials">${matHtml}</div></span>
        </div>
      </div>
    </div>
    <div class="card-foot">
      <div class="foot-actions">${slideBtn}${notasBtn}${repasoBtn}${resultsBtn}</div>
      <button class="check-btn ${btnClass}" onclick="toggleDone('${gradeId}',${n})">
        ${btnText}
      </button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════
function toggleDone(gradeId, sessionNum){
  const done = loadDone(gradeId);
  if(done.has(sessionNum)) done.delete(sessionNum);
  else done.add(sessionNum);
  saveDone(gradeId, done);
  renderPanel(gradeId);
}

function toggleExpand(btn){
  const card = btn.closest('.card');
  card.classList.toggle('expanded');
}

function toggleArchive(){
  const sec = document.getElementById('archive-section');
  const arr = document.getElementById('arch-arrow');
  sec.classList.toggle('visible');
  arr.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════
// RESULTS PANEL
// ═══════════════════════════════════════════════════════════
let _resultsCache = {};
let _currentResultsGrade = null;

const GRADE_LABELS_MAP = {
  prim6:'6.° Primaria', sec2:'2.° Secundaria', sec3:'3.° Secundaria',
  sec4:'4.° Secundaria', sec5:'5.° Secundaria'
};

function openResults(session, gradeId){
  _currentResultsGrade = gradeId || null;
  const titleEl = document.getElementById('results-panel-title');
  titleEl.textContent = gradeId
    ? '📊 Resultados — ' + (GRADE_LABELS_MAP[gradeId] || gradeId)
    : '📊 Resultados de alumnos';
  document.getElementById('results-overlay').classList.add('open');
  const ses = session ? String(session).padStart(2,'0') : '02';
  loadResults(ses);
}
function closeResultsPanel(){
  document.getElementById('results-overlay').classList.remove('open');
}
function closeResultsOnBg(e){
  if(e.target === document.getElementById('results-overlay')) closeResultsPanel();
}

async function loadResults(session){
  document.querySelectorAll('.results-session-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.session === session);
  });
  const content = document.getElementById('results-content');
  const summary = document.getElementById('results-summary');
  content.className = 'results-loading';
  content.innerHTML = '⏳ Cargando resultados…';
  summary.style.display = 'none';

  try {
    const res = await fetch(`/.netlify/functions/get-results?pw=${encodeURIComponent(CORRECT_PW)}&session=${session}`);
    if(!res.ok) throw new Error('Error ' + res.status);
    const data = await res.json();
    _resultsCache[session] = data;
    renderResults(data, session);
  } catch(err){
    content.className = 'results-empty';
    content.innerHTML = '⚠️ No se pudieron cargar los resultados.<br><small>' + err.message + '</small>';
  }
}

function renderResults(data, session){
  const content = document.getElementById('results-content');
  const summary = document.getElementById('results-summary');

  // Filter by grade if panel was opened from a specific grade card
  const display = _currentResultsGrade
    ? data.filter(r => r.grado === _currentResultsGrade)
    : data;

  if(!display.length){
    content.className = 'results-empty';
    const who = _currentResultsGrade
      ? (GRADE_LABELS_MAP[_currentResultsGrade] || _currentResultsGrade)
      : 'esta sesión';
    content.innerHTML = '📭 Aún no hay resultados para ' + who + ' · sesión ' + session + '.';
    summary.style.display = 'none';
    return;
  }

  // Summary stats — only for the displayed set
  const scores = display.map(r => r.score);
  const avg = (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);
  document.getElementById('rs-total').textContent = display.length;
  document.getElementById('rs-avg').textContent = avg + '/20';
  document.getElementById('rs-max').textContent = Math.max(...scores) + '/20';
  document.getElementById('rs-min').textContent = Math.min(...scores) + '/20';
  summary.style.display = 'flex';

  // Sort by grade then name
  const sorted = [...display].sort((a,b)=>{
    const ga = a.grado, gb = b.grado;
    if(ga < gb) return -1; if(ga > gb) return 1;
    return (a.nombre||'').localeCompare(b.nombre||'');
  });

  // Grade group headers only when showing all grades at once
  let curGrp = null;
  const rows = sorted.map(r=>{
    const [emoji, label, cls] =
      r.score>=18?['🏆','Excelente','ok']:
      r.score>=14?['⭐','Bueno','good']:
      r.score>=10?['📈','En proceso','warn']:
                  ['📚','Necesita refuerzo','low'];
    const gl = GRADE_LABELS_MAP[r.grado] || r.grado;
    const rawDate = r.fecha ? new Date(r.fecha) : null;
    const fechaStr = rawDate ? rawDate.toLocaleDateString('es-PE',{
      day:'2-digit', month:'short', year:'numeric'
    }) + ' ' + rawDate.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}) : '—';

    let groupRow = '';
    if(!_currentResultsGrade && r.grado !== curGrp){
      curGrp = r.grado;
      const count = sorted.filter(x=>x.grado===r.grado).length;
      groupRow = `<tr><td colspan="7" class="grade-group-label">📚 ${gl} &nbsp;·&nbsp; ${count} alumno${count===1?'':'s'}</td></tr>`;
    }
    return groupRow + `<tr id="row-${encodeURIComponent(r._key||'')}">
      <td><strong style="color:#fff">${r.nombre}</strong></td>
      <td style="color:var(--text-muted);font-size:13px">${gl}</td>
      <td class="res-score-cell">${r.score}<sub> /20</sub></td>
      <td style="color:var(--text-muted)">${r.correctas ?? r.correct ?? '?'} / ${r.total ?? 10}</td>
      <td><span class="res-pill ${cls}">${emoji} ${label}</span></td>
      <td style="color:var(--text-dim);font-size:13px">${fechaStr}</td>
      <td>${r._key ? `<button class="res-delete-btn" onclick="deleteResult('${r._key.replace(/'/g,"\\'")}','${r.nombre.replace(/'/g,"\\'")}')">🗑</button>` : ''}</td>
    </tr>`;
  }).join('');

  content.className = '';
  content.innerHTML = `<div class="results-table-wrap">
    <table class="results-table">
      <thead><tr>
        <th>Nombre</th><th>Grado</th><th>Puntaje</th><th>Correctas</th><th>Nivel</th><th>Fecha y hora</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function deleteResult(key, nombre){
  if(!confirm(`¿Borrar el resultado de "${nombre}"?\nEsto también libera su intento para que pueda volver a rendir.`)) return;
  try {
    const res = await fetch('/.netlify/functions/delete-result', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ pw: CORRECT_PW, key })
    });
    if(!res.ok) throw new Error('Error ' + res.status);
    // Remove row from DOM immediately
    const rowId = 'row-' + encodeURIComponent(key);
    const row = document.getElementById(rowId);
    if(row) row.remove();
    // Update cache
    const active = document.querySelector('.results-session-tab.active');
    const session = active ? active.dataset.session : '02';
    if(_resultsCache[session]){
      _resultsCache[session] = _resultsCache[session].filter(r => r._key !== key);
      renderResults(_resultsCache[session], session); // renderResults uses _currentResultsGrade internally
    }
  } catch(err) {
    alert('Error al borrar: ' + err.message);
  }
}

function exportXLSX(){
  const active = document.querySelector('.results-session-tab.active');
  const session = active ? active.dataset.session : '02';
  const all = _resultsCache[session] || [];
  const data = _currentResultsGrade ? all.filter(r => r.grado === _currentResultsGrade) : all;
  if(!data.length){ alert('No hay datos para exportar.'); return; }
  const rows = data.map(r=>{
    const level = r.score>=18?'Excelente':r.score>=14?'Bueno':r.score>=10?'En proceso':'Necesita refuerzo';
    return {
      'Nombre': r.nombre,
      'Grado': GRADE_LABELS_MAP[r.grado] || r.grado,
      'Sesión': r.sesion,
      'Puntaje': r.score,
      'Correctas': r.correctas ?? r.correct ?? '',
      'Total preguntas': r.total ?? 10,
      'Nivel': level,
      'Fecha': r.fecha || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Resultados');
  XLSX.writeFile(wb, `resultados-sesion-${session}.xlsx`);
}

// ═══════════════════════════════════════════════════════════
// INIT

updateLogoutBtn();
render();
</script>
