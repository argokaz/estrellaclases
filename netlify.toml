[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# ── Consola de la profesora ──
# /profe sirve el dashboard, que detecta la ruta y pinta la consola
# en vez de la vista del alumno. La contraseña la pide la propia página.
[[redirects]]
  from = "/profe"
  to = "/index.html"
  status = 200

# ── Enlace corto de acceso a los prompts ──
# clases.estrellavizcarra.com/p/AULA-XXXXXX  →  la biblioteca completa.
# Es el enlace que se manda por WhatsApp: corto y fácil de dictar.
[[redirects]]
  from = "/p/:code"
  to = "/prompts/todos/?k=:code"
  status = 200

# ── Keep-alive: evita que Supabase pause por inactividad ──
# Corre lunes y jueves a las 8am UTC (2x/semana, suficiente para el límite de 7 días)
[functions."keep-alive"]
  schedule = "0 8 * * 1,4"
